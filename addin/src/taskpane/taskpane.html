<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gordon</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" />
  </head>
  <body>
    <main id="app" class="hidden">
      <header class="pane-head">
        <div class="pane-head-main">
          <h1>Gordon</h1>
          <div id="companyTitle" class="company-title"></div>
        </div>
        <div class="pane-head-right">
          <div id="credits" class="credits" title="Credits laut handelsregister.ai"></div>
          <span id="healthDot" class="health-dot" title="Proxy-Status"></span>
        </div>
      </header>

      <div id="reportView">
      <section class="feature-panel">
        <label for="featureSelect">Feature</label>
        <select id="featureSelect"></select>
        <div id="featureInfo" class="feature-info"></div>
      </section>

      <section class="block">
        <div class="block-head">
          <label>Firmen</label>
          <button id="refreshCompanies" class="link-btn" type="button">Aus Excel-Auswahl</button>
        </div>
        <div id="companyList" class="company-list"></div>
        <div class="add-row">
          <input id="companyAdd" type="text" placeholder="Firma eingeben – oder Zelle markieren + „+“" />
          <button id="companyAddBtn" class="secondary" type="button">+</button>
        </div>
      </section>

      <section class="block">
        <label>Optionen</label>
        <div id="yearOption">
          <div class="field-inline">
            <div>
              <label for="yearFrom">Jahr ab</label>
              <input id="yearFrom" type="number" inputmode="numeric" placeholder="z. B. 2020" />
            </div>
            <div>
              <label for="yearTo">Jahr bis</label>
              <input id="yearTo" type="number" inputmode="numeric" placeholder="z. B. 2024" />
            </div>
          </div>
          <div id="yearQuick" class="year-quick"></div>
        </div>
        <div class="field">
          <label for="targetMode">Zielblatt</label>
          <select id="targetMode">
            <option value="per-company">Ein Blatt pro Firma (Reports untereinander)</option>
            <option value="combined">Ein kombiniertes Blatt</option>
          </select>
        </div>
      </section>

      <section class="block">
        <button id="generate" class="primary" type="button">Report erzeugen</button>
        <div id="status" class="status"></div>
      </section>

      <details class="block proxy-block">
        <summary>Einstellungen</summary>
        <label for="proxyUrl">Proxy-Adresse (Server)</label>
        <div class="field-inline">
          <input id="proxyUrl" type="text" placeholder="https://dein-proxy.example.com/api" />
          <button id="testConn" class="secondary" type="button">Test</button>
        </div>
        <label for="userToken">Zugangs-Token (persönlich)</label>
        <input id="userToken" type="password" placeholder="vom Administrator erhalten" />
        <p class="muted-line">Nur bei der Ersteinrichtung nötig.</p>
      </details>
      </div>

      <div id="detectView" class="hidden">
        <section class="block">
          <div class="block-head">
            <label>Tabelle</label>
            <button id="detectRescan" class="link-btn" type="button">Auswahl neu lesen</button>
          </div>
          <div id="detectRange" class="muted-line">Markiere deine Tabelle (mit Kopfzeile) und klicke „Auswahl neu lesen".</div>
        </section>

        <section class="block">
          <label>Spaltenzuordnung</label>
          <div id="mappingList" class="mapping-list"></div>
          <p class="muted-line">Input = Spalte mit den Firmennamen. Ausgabefelder schreiben in die gewählte (oder neue) Spalte.</p>
        </section>

        <section class="block">
          <button id="fillData" class="primary" type="button">Daten füllen</button>
          <div id="detectStatus" class="status"></div>
        </section>
      </div>
    </main>
  </body>
</html>
