<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gordan v2</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" />
  </head>
  <body>
    <main id="app" class="hidden">
      <header class="pane-head">
        <div>
          <p class="eyebrow">handelsregister.ai</p>
          <h1>Gordan v2</h1>
        </div>
        <span id="healthDot" class="health-dot" title="Proxy-Status"></span>
      </header>

      <section class="feature-panel">
        <label for="featureSelect">Feature</label>
        <select id="featureSelect"></select>
        <div id="featureInfo" class="feature-info"></div>
      </section>

      <section class="block">
        <div class="block-head">
          <label>Firmen</label>
          <button id="refreshCompanies" class="link-btn" type="button">Aus Excel-Auswahl</button>
        </div>
        <div id="companyList" class="company-list"></div>
        <div class="add-row">
          <input id="companyAdd" type="text" placeholder="Firma manuell hinzufügen" />
          <button id="companyAddBtn" class="secondary" type="button">+</button>
        </div>
      </section>

      <section class="block">
        <label>Optionen</label>
        <div id="yearOption">
          <div class="field-inline">
            <div>
              <label for="yearFrom">Jahr ab</label>
              <input id="yearFrom" type="number" inputmode="numeric" placeholder="z. B. 2020" />
            </div>
            <div>
              <label for="yearTo">Jahr bis</label>
              <input id="yearTo" type="number" inputmode="numeric" placeholder="z. B. 2024" />
            </div>
          </div>
          <div id="yearQuick" class="year-quick"></div>
        </div>
        <div class="field">
          <label for="targetMode">Zielblatt</label>
          <select id="targetMode">
            <option value="per-company">Ein Blatt pro Firma (Reports untereinander)</option>
            <option value="combined">Ein kombiniertes Blatt</option>
          </select>
        </div>
      </section>

      <section class="block">
        <button id="generate" class="primary" type="button">Report erzeugen</button>
        <div id="status" class="status"></div>
      </section>

      <section class="block proxy-block">
        <label for="proxyUrl">Proxy</label>
        <div class="field-inline">
          <input id="proxyUrl" type="text" placeholder="https://localhost:3001/api" />
          <button id="testConn" class="secondary" type="button">Test</button>
        </div>
      </section>
    </main>
  </body>
</html>
